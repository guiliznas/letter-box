name: letterbox
description: Leitor de newsletters com sincronização do Gmail, leitura offline e resumos por IA.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1

  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  google_sign_in: ^7.0.0

  googleapis: ^13.2.0
  http: ^1.2.2

  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5

  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  webview_flutter: ^4.10.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
